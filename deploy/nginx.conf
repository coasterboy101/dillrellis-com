# Reverse proxy for the Node process started by dillrellis-com.service.
# Installed to /etc/nginx/sites-available/dillrellis.com by the one-time setup
# in the README. Certbot adds the HTTPS server block and the HTTP redirect.

upstream dillrellis_com {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name dillrellis.com www.dillrellis.com;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        proxy_pass http://dillrellis_com;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else, including index.html for client-side routes (/projects,
    # /about), must be revalidated so new deploys are picked up.
    location / {
        proxy_pass http://dillrellis_com;
        add_header Cache-Control "no-cache";
    }
}
